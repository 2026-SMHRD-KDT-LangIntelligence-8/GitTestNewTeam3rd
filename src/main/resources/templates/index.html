<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주먹밥 - 메인 대시보드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Pretendard', -apple-system, sans-serif;
    }

    .mobile-container {
      width: 360px;
      height: 740px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
    }

    /* 🔥 헤더 수정 */
    .header {
      flex: 1.2;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #f9f9f9;
      position: relative;
    }

    #headerTitle {
      font-size: 20px;
      font-weight: 800;
      color: #333;
      letter-spacing: -0.5px;
    }

    /* 🔥 로그인 버튼 */
    .login-move-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #333;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-move-btn:hover {
      opacity: 0.9;
    }

    .character-area {
      flex: 5.8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .bubble-container {
      background: #F2F2F2;
      padding: 20px;
      border-radius: 25px;
      margin-bottom: 25px;
      position: relative;
      width: 85%;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.6;
      word-break: keep-all;
    }

    .bubble-container::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 12px solid #F2F2F2;
    }

    .jumeok-img {
      width: 220px;
      height: auto;
    }

    .info-area {
      flex: 3;
      padding: 0 30px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .progress-section {
      width: 100%;
    }

    .progress-text-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #challengeNameDisplay {
      font-size: 15px;
      font-weight: 700;
      color: #333;
    }

    #progressPercent {
      font-size: 16px;
      font-weight: 800;
      color: #FFD233;
    }

    .progress-bar-bg {
      width: 100%;
      height: 16px;
      background: #EBEBEB;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #FFD233;
      border-radius: 10px;
      transition: width 1s ease-in-out;
    }

    .accumulated-text {
      margin-top: 15px;
      font-size: 13px;
      color: #aaaaaa;
      text-align: right;
    }

    .is-over .progress-bar-fill { background: #FF5A5A; }
    .is-over #progressPercent { color: #FF5A5A; }
    .is-over .bubble-container { background: #FFEAEA; }
    .is-over .bubble-container::after { border-top-color: #FFEAEA; }

  </style>
</head>

<body>

<div class="mobile-container" id="mainDashboard">

  <!-- 🔥 헤더 + 로그인 버튼 -->
  <header class="header">
    <h1 id="headerTitle">🍙 주먹밥 🍙</h1>
    <button class="login-move-btn" onclick="goToLogin()">로그인</button>
  </header>

  <main class="character-area">
    <div class="bubble-container">
      <p id="bubbleMessage">데이터를 불러오고 있어요! 🍙</p>
    </div>
    <img src="/images/jumeok_default.png" alt="주먹밥 캐릭터" class="jumeok-img" id="jumeokImg">
  </main>

  <footer class="info-area">
    <div class="progress-section">
      <div class="progress-text-row">
        <span id="challengeNameDisplay">챌린지 확인 중...</span>
        <span id="progressPercent">0%</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>

      <div class="accumulated-text">
        총 누적: <span id="accumulatedUsage">0</span>원
      </div>
    </div>
  </footer>

</div>

<script src="/js/index.js"></script>

</body>
</html>
