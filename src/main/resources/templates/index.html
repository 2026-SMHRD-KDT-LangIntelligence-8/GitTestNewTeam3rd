<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주먹밥 - 메인</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #e9e9e9;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      width: 360px;
      height: 640px;
      padding: 20px;
      border-radius: 20px;
      position: relative;
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 헤더 영역 */
    .integrated-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      margin-top: 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .user-nickname {
      font-size: 13px;
      font-weight: bold;
      color: #333;
      flex: 1;
    }

    .top-title {
      font-size: 17px;
      font-weight: bold;
      flex: 2;
      text-align: center;
    }

    .logout-area {
      flex: 1;
      text-align: right;
    }

    .logout-btn {
      font-size: 11px;
      color: #bbb;
      text-decoration: none;
      border: 1px solid #eee;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* 플로팅 메뉴 버튼 */
    .menu-trigger {
      position: absolute;
      top: 130px;
      right: 20px;
      background: #ffcc00;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .menu-wrapper {
      position: absolute;
      top: 190px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: scaleY(0);
      transform-origin: top;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 99;
    }

    .menu-wrapper.active {
      transform: scaleY(1);
    }

    .sub-btn {
      width: 42px;
      height: 42px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border: 1px solid #f5f5f5;
      cursor: pointer;
    }

    /* 캐릭터 및 말풍선 */
    .character-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .bubble-container {
      position: relative;
      margin-bottom: 10px;
    }

    .bubble {
      background: #f9f9f9;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #eee;
      position: relative;
      text-align: center;
      min-width: 150px;
    }

    .bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #f9f9f9 transparent transparent;
    }

    .character-img {
      width: 160px;
      height: auto;
      margin-top: 5px;
    }

    /* 대시보드 카드 (하단) */
    .dashboard-card {
      width: 100%;
      padding: 15px 5px;
      border-top: 1px solid #f0f0f0;
      box-sizing: border-box;
      margin-top: auto;
    }

    .card-label {
      font-size: 11px;
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .challenge-name {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .progress-bar {
      background: #f0f0f0;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .progress-fill {
      background: #ffcc00;
      height: 100%;
      width: 0%;
      transition: 0.5s;
    }

    .progress-info {
      font-size: 10px;
      color: #ccc;
      text-align: right;
    }

    .usage-section {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .usage-label {
      font-size: 12px;
      color: #999;
    }

    .usage-amount {
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="integrated-header">
    <div class="user-nickname">
      <span id="nicknameDisplay">유저</span>님
    </div>
    <div class="top-title">🍙 주먹밥 🍙</div>
    <div class="logout-area">
      <span class="logout-btn" id="loginMoveBtn">로그인</span>
    </div>
  </div>

  <div class="menu-trigger" id="menuTrigger">
    <span>🍙</span>
  </div>

  <div class="menu-wrapper" id="menuWrapper">
    <div class="sub-btn" title="오늘의 소비">💰</div>
    <div class="sub-btn" title="소비 캘린더">📅</div>
    <div class="sub-btn" title="챌린지 설정">🏆</div>
    <div class="sub-btn" title="마이페이지">⚙️</div>
  </div>

  <div class="character-section">
    <div class="bubble-container">
      <div class="bubble" id="bubbleMessage">
        반가워요! 🍙
      </div>
    </div>
    <img id="characterImg" src="/img/normal_meokbap.png" alt="주먹밥 마스코트" class="character-img">
  </div>

  <div class="dashboard-card">
    <div class="card-label">현재 진행 중인 챌린지</div>
    <div class="challenge-name" id="challengeNameDisplay">진행 중인 챌린지가 없어요</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressBarFill"></div>
    </div>

    <div class="progress-info" id="progressPercent">0.0%</div>

    <div class="usage-section">
      <span class="usage-label">누적 소비 금액</span>
      <span class="usage-amount">
        <span id="accumulatedUsage">0</span>원
      </span>
    </div>
  </div>
</div>

<script src="/js/index.js"></script>
</body>
</html>
