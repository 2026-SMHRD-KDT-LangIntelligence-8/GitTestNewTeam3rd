<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카드/계좌 연결</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            height: 874px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 80px;
            margin-top: 50px;
        }

        .input-box {
            margin-bottom: 33px;
        }

        .input-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-box input,
        .input-box select {
            width: 90%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: black;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 50px;
        }

        .sub-title {
            margin-top: 30px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #403F3F;
        }

        .account-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fafafa;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>카드 연결</h1>

    <div class="input-box">
        <label for="organization">카드사 선택</label>
        <select id="organization">
            <!-- JS가 카드사 목록을 자동으로 채움 -->
        </select>
    </div>

    <div class="input-box">
        <label for="loginId">카드사 로그인 아이디</label>
        <input type="text" id="loginId" placeholder="앱/홈페이지 로그인 아이디 입력">
    </div>

    <div class="input-box">
        <label for="password">카드사 로그인 비밀번호</label>
        <input type="password" id="password" placeholder="로그인 비밀번호 입력">
    </div>

    <div class="input-box">
        <label for="accountAlias">별명 (선택)</label>
        <input type="text" id="accountAlias" placeholder="예: 주사용 카드">
    </div>

    <button class="btn" onclick="connectAccount()">연결하기</button>

    <div class="sub-title">내 연결 계정</div>
    <div id="accountList"></div>
</div>

<script src="/js/codef_connect.js"></script>
</body>
</html>
