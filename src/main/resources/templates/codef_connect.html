<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 연결</title>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 360px;
            height: 640px;
            padding: 30px 20px;
            border-radius: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .back-btn {
            text-decoration: none;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
            cursor: pointer;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        /* 입력 폼 */
        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            border: 1px solid #eee;
            border-radius: 12px;
            font-size: 14px;
            background-color: #f9f9f9;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box; /* ⭐ 핵심 */
        }

        .input-field:focus {
            border-color: #000;
            background-color: #fff;
        }

        /* select 전용 */
        select.input-field {
            height: 46px; /* input이랑 높이 맞추기 */
        }


        /* 버튼 */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background-color: #333;
        }

        /* 계정 리스트 */
        .sub-title {
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #403F3F;
        }

        .account-item {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            background: #fafafa;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 헤더 -->
    <div class="header">
        <a href="#" onclick="history.back(); return false;" class="back-btn">←</a>
        <span class="title">카드 연결</span>
    </div>

    <!-- 카드사 선택 -->
    <div class="form-group">
        <span class="label">카드사 선택</span>
        <select id="organization" class="input-field"></select>
    </div>

    <!-- 아이디 -->
    <div class="form-group">
        <span class="label">로그인 아이디</span>
        <input type="text" id="loginId" class="input-field" placeholder="아이디 입력">
    </div>

    <!-- 비밀번호 -->
    <div class="form-group">
        <span class="label">비밀번호</span>
        <input type="password" id="password" class="input-field" placeholder="비밀번호 입력">
    </div>

    <!-- 별명 -->
    <div class="form-group">
        <span class="label">별명 (선택)</span>
        <input type="text" id="accountAlias" class="input-field" placeholder="예: 주사용 카드">
    </div>

    <!-- 버튼 -->
    <button class="btn-submit" onclick="connectAccount()">연결하기</button>

    <!-- 계정 목록 -->
    <div class="sub-title">내 연결 계정</div>
    <div id="accountList"></div>

</div>

<script src="/js/codef_connect.js"></script>

</body>
</html>
