<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>회원가입</h1>

    <div class="input-box">
        <label>아이디</label>
        <input type="text" id="userId" placeholder="아이디 입력">
    </div>

    <div class="input-box">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <div class="input-box">
        <label>생년월일</label>
        <input type="text" id="birthDate" placeholder="2000-01-01">
    </div>

    <div class="input-box">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="닉네임 입력">
    </div>

    <div class="input-box">
        <label>전화번호</label>
        <input type="text" id="phoneNumber" placeholder="01012345678">
    </div>

    <div class="input-box">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@email.com">
    </div>

    <button onclick="signup()">회원가입</button>
</div>

<!-- JS 연결 -->
<script src="/js/signup.js"></script>

</body>
</html>
