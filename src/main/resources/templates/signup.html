<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 360px;
            height: 640px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);

            /* ⭐ 핵심 */
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* ⭐ 스크롤 영역 핵심 */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
        }

        /* 스크롤바 숨기기 */
        .scroll-area::-webkit-scrollbar {
            display: none;
        }

        h1 {
            text-align: center;
            margin: 10px 0 20px;
            font-size: 26px;
            font-weight: 600;
            color: #222;
            flex-shrink: 0;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #999;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
            background-color: #fafafa;
            font-size: 13px;
            box-sizing: border-box;
        }

        /* 아이디 박스 */
        .id-box {
            position: relative;
        }

        .id-box input {
            width: 100%;
            padding: 10px;
            padding-right: 100px;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            font-size: 13px;
            box-sizing: border-box;
        }

        .id-box .check-btn {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            height: 28px;
            padding: 0 12px;
            border: none;
            border-radius: 14px;
            background-color: #666666;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        #idCheckResult, #passwordCheckResult {
            margin-top: 5px;
            font-size: 13px;
        }

        .signup-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;

            /* 버튼은 아래 고정 느낌 */
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>회원가입</h1>

    <div class="scroll-area">

        <div class="input-box">
            <label>아이디</label>
            <div class="id-box">
                <input type="text" id="userId" placeholder="아이디 입력">
                <button type="button" class="check-btn" onclick="checkId()">중복체크</button>
            </div>
            <div id="idCheckResult"></div>
        </div>

        <div class="input-box">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호 입력">
        </div>

        <div class="input-box">
            <label>비밀번호 확인</label>
            <input type="password" id="passwordConfirm" placeholder="비밀번호 다시 입력">
            <div id="passwordCheckResult"></div>
        </div>

        <div class="input-box">
            <label>생년월일</label>
            <input type="text" id="birthDate" placeholder="2000-01-01">
        </div>

        <div class="input-box">
            <label>닉네임</label>
            <input type="text" id="nickname" placeholder="닉네임 입력">
        </div>

        <div class="input-box">
            <label>전화번호</label>
            <input type="text" id="phoneNumber" placeholder="01012345678">
        </div>

        <div class="input-box">
            <label>이메일</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>

        <!-- 버튼도 스크롤 안쪽으로 넣어야 자연스럽게 내려감 -->
        <button type="button" class="signup-btn" onclick="signup()">가입하기</button>

    </div>

</div>

<script src="/js/signup.js"></script>

</body>
</html>
