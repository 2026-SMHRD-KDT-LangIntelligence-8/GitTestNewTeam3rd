<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* ⭐ 아이디 + 버튼 가로 정렬 */
        .id-box {
            display: flex;
            gap: 8px;
        }

        .id-box input {
            flex: 1;
        }

        .check-btn {
            width: 100px;
            padding: 10px;
            background-color: #2196F3;
            border-radius: 6px;
            font-size: 14px;
        }

        .check-btn:hover {
            background-color: #1976D2;
        }

        /* 결과 메시지 */
        #idCheckResult {
            margin-top: 5px;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>회원가입</h1>

    <!-- ⭐ 아이디 부분 수정 -->
    <div class="input-box">
        <label>아이디</label>

        <div class="id-box">
            <input type="text" id="userId" placeholder="아이디 입력">
            <button type="button" class="check-btn" onclick="checkId()">중복확인</button>
        </div>

        <!-- 결과 표시 -->
        <div id="idCheckResult"></div>
    </div>

    <div class="input-box">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <div class="input-box">
        <label>비밀번호 확인</label>
        <input type="password" id="passwordConfirm" placeholder="비밀번호 다시 입력">
        <div id="passwordCheckResult" style="font-size:13px; margin-top:5px;"></div>
    </div>

    <div class="input-box">
        <label>생년월일</label>
        <input type="text" id="birthDate" placeholder="2000-01-01">
    </div>

    <div class="input-box">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="닉네임 입력">
    </div>

    <div class="input-box">
        <label>전화번호</label>
        <input type="text" id="phoneNumber" placeholder="01012345678">
    </div>

    <div class="input-box">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@email.com">
    </div>

    <button type="button" onclick="signup()">회원가입</button>
</div>

<script src="/js/signup.js"></script>

</body>
</html>
