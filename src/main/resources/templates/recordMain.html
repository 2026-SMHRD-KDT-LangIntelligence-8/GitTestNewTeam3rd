<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 기록 메인</title>
    <style>
        body { background-color: #e9e9e9; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; width: 360px; height: 640px; padding: 20px; border-radius: 20px; position: relative; box-sizing: border-box; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .header-title { color: #888; font-size: 12px; margin-bottom: 20px; text-align: left; }
        .date-selector { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; position: relative; }
        .date-text { font-size: 20px; font-weight: bold; min-width: 120px; text-align: center; }
        .arrow { color: #ccc; cursor: pointer; font-size: 28px; border: none; background: none; outline: none; padding: 0 10px; }
        .arrow:hover { color: #ffcc00; }
        .content-box { background-color: #fafff0; border-radius: 10px; height: 420px; padding: 10px; overflow-y: auto; }

        /* 헤더 컬럼 비율 조정 */
        .list-header { display: flex; justify-content: space-between; padding: 10px 15px; font-weight: bold; color: #666; border-bottom: 1px solid #e0e7d0; margin-bottom: 10px; font-size: 14px; }
        .list-header span { text-align: center; }

        /* 아이템 레이아웃 수정 */
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 10px; border-bottom: 1px dotted #e0e7d0; text-decoration: none; color: black; cursor: pointer; }
        .record-item:hover { background-color: #f0f7e0; }

        /* 각 칸의 너비 확보 */
        .col-time { flex: 1.2; text-align: left; font-size: 13px; color: #777; }
        .col-store { flex: 2; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-amount { flex: 1.5; text-align: right; font-weight: bold; }
        .col-status { flex: 1.3; text-align: right; font-size: 18px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }

        .impulse-mark { color: #ff4d4d; font-size: 14px; font-weight: bold; }

        .btn-add { position: absolute; bottom: 30px; right: 30px; background-color: #ffcc00; width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 35px; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-decoration: none; }
        .no-data { text-align: center; padding-top: 120px; color: #bbb; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">오늘의 기록 메인</div>

    <div class="date-selector">
        <button type="button" class="arrow" onclick="moveDate(-1)">&lt;</button>
        <span class="date-text" id="targetDateDisplay" th:text="${targetDate}">2026-03-26</span>
        <button type="button" class="arrow" onclick="moveDate(1)">&gt;</button>
    </div>

    <div class="content-box">
        <div class="list-header">
            <span style="flex:1.2; text-align:left;">시간</span>
            <span style="flex:2;">장소</span>
            <span style="flex:1.5; text-align:right;">금액</span>
            <span style="flex:1.3; text-align:right;">상태</span>
        </div>

        <div th:if="${list != null and !#lists.isEmpty(list)}">
            <div th:each="log : ${list}" class="record-item"
                 th:onclick="|location.href='/api/recordDetail/' + ${log.logId}|">

                <span class="col-time"
                      th:text="${#strings.length(log.spentAt) > 5 ? #strings.substring(log.spentAt, 11, 16) : log.spentAt}">시간</span>

                <span class="col-store" th:text="${log.storeName}">장소</span>

                <span class="col-amount"
                      th:text="${log.amount != null ? #numbers.formatInteger(log.amount, 0, 'COMMA') + '원' : '0원'}">0원</span>

                <span class="col-status">
                    <span th:if="${log.isImpulsive}" class="impulse-mark">💥</span>
                    <span th:text="${log.emotionTag}">😊</span>
                </span>
            </div>
        </div>

        <div th:if="${list == null or #lists.isEmpty(list)}" class="no-data">
            기록된 지출 내역이 없습니다.<br>
            새로운 지출을 추가해 보세요!
        </div>
    </div>

    <a th:href="@{/api/saveLog(userId=${userId})}" class="btn-add">+</a>
</div>

<script th:inline="javascript">
    function moveDate(offset) {
        const dateDisplay = document.getElementById('targetDateDisplay');
        const dateText = dateDisplay.innerText.trim();
        const parts = dateText.split('-');
        let date = new Date(parts[0], parts[1] - 1, parts[2]);
        date.setDate(date.getDate() + offset);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const newDateStr = `${y}-${m}-${d}`;

        window.location.href = window.location.pathname + "?date=" + newDateStr;
    }
</script>

</body>
</html>
