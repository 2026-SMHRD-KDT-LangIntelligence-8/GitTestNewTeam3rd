<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주먹밥 - 회원 정보</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 360px;
            height: 640px;
            padding: 30px 20px;
            border-radius: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 헤더 */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .back-btn {
            text-decoration: none;
            color: #000;
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
            cursor: pointer;
        }

        .back-btn:hover {
            color: #000;
            text-decoration: none;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* 닉네임 표시 구역 */
        .welcome-section {
            margin-top: 40px;
            margin-bottom: 60px;
            text-align: center;
        }

        .welcome-text {
            font-size: 20px;
            font-weight: 500;
            color: #333;
        }

        .user-id {
            font-weight: bold;
            color: #000;
        }

        /* 버튼 그룹 */
        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-black {
            background-color: #000;
            color: #fff;
        }

        .btn-black:hover {
            background-color: #333;
        }

        .btn-red {
            background-color: #e74c3c;
            color: #fff;
            margin-top: 5px;
        }

        .btn-red:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 헤더 -->
    <div class="header">
        <a href="/" class="back-btn">←</a>
        <span class="title">회원 정보</span>
    </div>

    <div class="welcome-section">
        <p class="welcome-text">
            <span class="user-id" th:text="${user.userId}">guest</span>님 환영합니다!
        </p>
    </div>

    <div class="btn-group">
        <a th:href="@{/codef/connect-page}" class="btn btn-black">계좌 및 카드 연동</a>
        <a th:href="@{/edit-profile}" class="btn btn-black">회원정보 수정</a>
        <a href="javascript:void(0);" onclick="confirmDelete()" class="btn btn-red">탈퇴하기</a>
    </div>
</div>

<script>
    function confirmDelete() {
        if (confirm("정말로 주먹밥 서비스를 탈퇴하시겠어요? 🥺🍙\n탈퇴 시 모든 정보가 삭제됩니다")) {
            fetch('/user/delete', {
                method: 'DELETE',
                credentials: 'include'
            })
                .then(response => response.text().then(text => ({
                    ok: response.ok,
                    text: text
                })))
                .then(result => {
                    if (result.ok && result.text === "success") {
                        alert("탈퇴가 완료되었습니다. 이용해주셔서 감사합니다. 🍙");
                        location.href = "/login";
                    } else {
                        alert("탈퇴 처리 중 오류가 발생했습니다. 다시 시도해 주세요.");
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("서버 통신 중 오류가 발생했습니다.");
                });
        }
    }
</script>

</body>
</html>
