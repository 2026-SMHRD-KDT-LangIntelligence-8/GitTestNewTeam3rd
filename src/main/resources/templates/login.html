<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 360px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 60px;
      color: #333333;
    }

    .input-box {
      margin-bottom: 17px;

    }

    .input-box label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    .input-box input {
      width: 95%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.3s;

    }


    .btn-login {
      width: 100%;
      padding: 14px;
      background: black;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 50px;
    }



    .bottom-text {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #706A6A;
    }

    .bottom-text a {
      color: #FFCC00;
      text-decoration: none;
      font-weight: bold;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">

  <h1 style='font-size:35px;'>&#127833;주먹밥!</h1>

  <div class="input-box">

    <input type="text" id="userId" placeholder="아이디 입력">
  </div>

  <div class="input-box">

    <input type="password" id="password" placeholder="비밀번호 입력">
  </div>

  <button class="btn-login" onclick="login()">로그인</button>

  <div class="bottom-text">
    계정이 없으신가요? <a href="/signup">회원가입</a>
  </div>
</div>

<script src="/js/login.js"></script>

</body>
</html>
