<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정보수정</title>

    <style>



        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 360px;
            height: 640px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 90px;
            margin-top: 40px;
        }

        input {
            width: 250px;
        }

        .input-box {

            margin-bottom: 25px;
            display: flex;              /* 가로 정렬 */
            align-items: center;        /* 세로 가운데 정렬 */
            gap: 1px;
        }

        .input-box label {
            margin-left: 8px;
            margin-top: auto;
            margin-bottom: auto;
            font-weight: bold;
            width: 100px; /* 라벨 너비 고정 */
            white-space: nowrap;
        }

        .id-box {
            /*display: flex;*/
            flex: none;                    /* 남은 공간 차지 */
            gap: 8px;
            width: 280px;
        }

        .input-box input {

            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;

            min-width: 0;
        }

        /* 버튼 스타일 */
        .check-btn {
            padding:  4px 2px;
            border: none;
            border-radius: 6px;
            background-color: black !important;
            color: white;
            cursor: pointer;
            white-space: nowrap;         /* 줄바꿈 방지 */
            margin: 0;

        }


        /* ⭐ 아이디 + 버튼 가로 정렬 */


        .id-box input {
            flex: 1;        /* ⭐ 다시 이걸로 */
            min-width: 0;
            height: 15px/* ⭐ 필수 */
        }

        .check-btn {
            width: 84px;
            padding: 10px;
            background-color: #2196F3;
            border-radius: 6px;
            font-size: 12px;
        }

        .check-btn:hover {
            background-color: #1976D2;
        }

        /* 결과 메시지 */
        #idCheckResult {
            margin-top: 5px;
            font-size: 13px;
        }

        button {
            margin-top: 50px;
            width: 100%;
            padding: 12px;
            background-color:  black !important;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>정보수정</h1>


    <!-- 결과 표시 -->
    <div id="idCheckResult"></div>
    <div class="input-box">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
    </div>





    <div class="input-box">
        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="닉네임 입력">
    </div>

    <div class="input-box">
        <label>전화번호</label>
        <input type="text" id="phoneNumber" placeholder="01012345678">
    </div>

    <div class="input-box">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@email.com">
    </div>

    <button type="button" onclick="signup()">수정하기</button>
</div>

<script src="/js/signup.js"></script>

</body>
</html>
