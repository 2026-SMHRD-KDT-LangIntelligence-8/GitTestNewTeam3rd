<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>챌린지 설정</title>
  <style>
    /* CSS 스타일은 그대로 유지 (변경 없음) */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
    }
    .container {
      width: 400px;
      min-height: 750px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      margin-bottom: 60px;
      margin-top: 40px;
      color: #000;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .name-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      font-size: 14px;
      color: #000;
      width: 110px;
      white-space: nowrap;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      box-sizing: border-box;
      transition: 0.3s;
    }
    input:focus {
      border-color: #FFCC00;
      outline: none;
    }
    .period-label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 14px;
    }
    .toggle-container {
      display: flex;
      background: #f1f3f4;
      padding: 6px;
      border-radius: 10px;
      gap: 5px;
      margin-bottom: 50px;
    }
    .toggle-item {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
      border-radius: 7px;
      font-size: 13px;
      transition: 0.3s;
      color: #666;
    }
    .toggle-item.active {
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      color: #000;
      font-weight: bold;
    }
    #customDateRange {
      display: none;
      margin-top: -35px;
      margin-bottom: 80px;
      border-left: 3px solid #FFCC00;
      padding: 10px 0 10px 20px;
      margin-left: 5px;
    }
    #customDateRange .form-group {
      margin-bottom: 15px;
    }
    .result-box {
      background: #FDFDE6;
      padding: 20px;
      border-radius: 10px;
      margin-top: 45px;
      border: 2px dashed #FFCC00;
      margin-bottom: 25px;
    }
    .result-text {
      font-size: 16px;
      font-weight: bold;
      color: #000;
      text-align: center;
    }
    .btn-save {
      width: 100%;
      padding: 15px;
      background-color: #000 !important;
      color: white !important;
      border: none !important;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🏆 챌린지 설정</h2>

  <form id="budgetForm">
    <div class="form-group name-group">
      <label>챌린지 이름</label>
      <input type="text" id="challengeName" placeholder="예: 무지출 챌린지, 식비 절약" required>
    </div>

    <label class="period-label">목표 기간</label>
    <div class="toggle-container" id="toggleArea">
      <div class="toggle-item active" data-days="30">1개월</div>
      <div class="toggle-item" data-days="7">1주일</div>
      <div class="toggle-item" data-days="custom">직접입력</div>
    </div>

    <div id="customDateRange">
      <div class="form-group">
        <label style="width: 60px;">시작일</label>
        <input type="date" id="startDate">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label style="width: 60px;">종료일</label>
        <input type="date" id="endDate">
      </div>
    </div>

    <div class="form-group">
      <label>총 예산 한도 (원)</label>
      <input type="number" id="totalLimit" value="0" step="10000" min="0" required>
    </div>

    <div class="form-group">
      <label>고정 지출 합계 (원)</label>
      <input type="number" id="fixedCostSum" value="0" step="10000" min="0">
    </div>

    <div class="result-box">
      <div class="result-text">
        하루 권장 예산: <span id="dailyAmount">0</span>원
      </div>
      <p style="font-size: 11px; text-align: center; color: #666; margin-top: 8px;">
        (총 예산 - 고정 지출) / 기간
      </p>
    </div>

    <button type="button" class="btn-save">챌린지 시작하기</button>
  </form>
</div>

<script src="/js/budget_create.js"></script>
</body>
</html>
