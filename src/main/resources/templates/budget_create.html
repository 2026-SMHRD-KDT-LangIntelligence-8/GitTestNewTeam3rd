<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>챌린지 설정</title>
  <style>
    body {
      background-color: #e9e9e9;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      width: 360px;
      height: 640px;
      padding: 0;
      border-radius: 20px;
      position: relative;
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .container::-webkit-scrollbar {
      display: none;
    }

    /* 1. 통합 헤더 */
    .header-section {
      display: flex;
      align-items: center;
      padding: 20px;
      position: sticky; /* 스크롤 해도 상단에 고정 */
      top: 0;
      background: white;
      z-index: 10;
      border-bottom: 1px solid #f0f0f0; /* 구분선 바 */
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #888;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      margin-right: 15px; /* 제목과의 간격 */
    }

    h2 {
      margin: 0;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      flex: 1;
      text-align: center;
      margin-right: 35px;
    }

    /* 2. 실제 입력 폼 영역 */
    .form-content {
      padding: 20px 25px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .form-group {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: bold;
      font-size: 13px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #eee;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #FFCC00;
      outline: none;
    }

    .toggle-container {
      display: flex;
      background: #f1f3f4;
      padding: 5px;
      border-radius: 10px;
      gap: 5px;
      margin-bottom: 25px;
    }

    .toggle-item {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
      border-radius: 7px;
      font-size: 12px;
      transition: 0.3s;
      color: #666;
    }

    .toggle-item.active {
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      color: #000;
      font-weight: bold;
    }

    #customDateRange {
      display: none;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      border-left: 4px solid #FFCC00;
    }

    .result-box {
      background: #fffdf0;
      padding: 20px;
      border-radius: 15px;
      margin-top: 10px;
      border: 1.5px dashed #FFCC00;
      margin-bottom: 25px;
      text-align: center;
    }

    .result-text {
      font-size: 16px;
      font-weight: bold;
      color: #000;
    }

    .formula-text {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }

    .btn-save {
      width: 100%;
      padding: 15px;
      background-color: #000 !important;
      color: white !important;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-section">
    <button type="button" class="close-btn" id="backBtn" onclick="history.back()">✕</button>
    <h2>🏆 챌린지 설정</h2>
  </div>

  <div class="form-content">
    <form id="budgetForm">
      <div class="form-group">
        <label>챌린지 이름</label>
        <input type="text" id="challengeName" placeholder="예: 무지출 챌린지, 식비 절약" required>
      </div>

      <label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 10px;">목표 기간</label>
      <div class="toggle-container" id="toggleArea">
        <div class="toggle-item active" data-days="30">1개월</div>
        <div class="toggle-item" data-days="7">1주일</div>
        <div class="toggle-item" data-days="custom">직접입력</div>
      </div>

      <div id="customDateRange">
        <div class="form-group" style="margin-bottom: 15px;">
          <label>시작일</label>
          <input type="date" id="startDate">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>종료일</label>
          <input type="date" id="endDate">
        </div>
      </div>

      <div class="form-group">
        <label>총 예산 한도 (원)</label>
        <input type="number" id="totalLimit" value="0" step="10000" min="0" required>
      </div>

      <div class="form-group">
        <label>고정 지출 합계 (원)</label>
        <input type="number" id="fixedCostSum" value="0" step="10000" min="0">
      </div>

      <div class="result-box">
        <div class="result-text">
          하루 권장 예산: <span id="dailyAmount">0</span>원
        </div>
        <div class="formula-text">
          (총 예산 - 고정 지출) / 기간
        </div>
      </div>

      <button type="button" class="btn-save">챌린지 시작하기</button>
    </form>
  </div>
</div>

<script src="/js/budget_create.js"></script>
</body>
</html>
