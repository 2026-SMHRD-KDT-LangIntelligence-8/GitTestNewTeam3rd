<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>챌린지 설정</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
    }


    .container {
      width: 400px;
      min-height: 750px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }


    h2 {
      text-align: center;
      margin-bottom: 60px;
      margin-top: 40px;
      color: #000;
      font-size: 24px;
    }


    .form-group {
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 15px;
    }


    .name-group {
      margin-bottom: 20px;
    }


    label {
      font-weight: bold;
      font-size: 14px;
      color: #000;
      width: 110px;
      white-space: nowrap;
    }


    input {
      flex: 1;
      padding: 10px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      box-sizing: border-box;
      transition: 0.3s;
    }


    input:focus {
      border-color: #FFCC00;
      outline: none;
    }


    .period-label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 14px;
    }


    .toggle-container {
      display: flex;
      background: #f1f3f4;
      padding: 6px;
      border-radius: 10px;
      gap: 5px;
      margin-bottom: 50px;
    }


    .toggle-item {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
      border-radius: 7px;
      font-size: 13px;
      transition: 0.3s;
      color: #666;
    }


    .toggle-item.active {
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      color: #000;
      font-weight: bold;
    }


    #customDateRange {
      display: none;
      margin-top: -35px;
      margin-bottom: 80px;
      border-left: 3px solid #FFCC00;
      padding: 10px 0 10px 20px;
      margin-left: 5px;
    }


    #customDateRange .form-group {
      margin-bottom: 15px;
    }


    .result-box {
      background: #FDFDE6;
      padding: 20px;
      border-radius: 10px;
      margin-top: 45px;
      border: 2px dashed #FFCC00;
      margin-bottom: 25px;
    }


    .result-text {
      font-size: 16px;
      font-weight: bold;
      color: #000;
      text-align: center;
    }


    .btn-save { width: 100%;
      padding: 15px;
      background-color: #000 !important;
      color: white !important;
      border: none !important;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }


  </style>
</head>
<body>

<div class="container">
  <h2>🏆 챌린지 설정</h2>

  <form id="budgetForm">
    <div class="form-group name-group">
      <label>챌린지 이름</label>
      <input type="text" id="challengeName" placeholder="예: 무지출 챌린지, 식비 절약" required>
    </div>

    <label class="period-label">목표 기간</label>
    <div class="toggle-container" id="toggleArea">
      <div class="toggle-item active" onclick="selectPeriod(30, this)">1개월</div>
      <div class="toggle-item" onclick="selectPeriod(7, this)">1주일</div>
      <div class="toggle-item" onclick="selectPeriod('custom', this)">직접입력</div>
    </div>

    <div id="customDateRange">
      <div class="form-group">
        <label style="width: 60px;">시작일</label>
        <input type="date" id="startDate" onchange="calculateDailyBudget()">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label style="width: 60px;">종료일</label>
        <input type="date" id="endDate" onchange="calculateDailyBudget()">
      </div>
    </div>

    <div class="form-group">
      <label>총 예산 한도 (원)</label>
      <input type="number" id="totalLimit" value="0" step="10000" min="0"
             oninput="validateMin(this)" onchange="validateMin(this)" required>
    </div>

    <div class="form-group">
      <label>고정 지출 합계 (원)</label>
      <input type="number" id="fixedCostSum" value="0" step="10000" min="0"
             oninput="validateMin(this)" onchange="validateMin(this)">
    </div>

    <div class="result-box">
      <div class="result-text">
        하루 권장 예산: <span id="dailyAmount">0</span>원
      </div>
      <p style="font-size: 11px; text-align: center; color: #666; margin-top: 8px;">
        (총 예산 - 고정 지출) / 기간
      </p>
    </div>

    <button type="button" class="btn-save" onclick="handleSave()">챌린지 시작하기</button>
  </form>
</div>

<script>
  // 입력값이 0보다 작으면 무조건 0으로 고정하는 함수
  function validateMin(input) {
    if (input.value < 0) {
      input.value = 0;
    }
    calculateDailyBudget();
  }

  let selectedDays = 30;
  const today = new Date().toISOString().split('T')[0];

  function selectPeriod(days, element) {
    document.querySelectorAll('.toggle-item').forEach(item => item.classList.remove('active'));
    element.classList.add('active');
    const customDiv = document.getElementById('customDateRange');
    const toggleArea = document.getElementById('toggleArea');

    if (days === 'custom') {
      customDiv.style.display = 'block';
      toggleArea.style.marginBottom = '45px';
    } else {
      customDiv.style.display = 'none';
      toggleArea.style.marginBottom = '65px';
      selectedDays = days;
      document.getElementById('startDate').value = today;
      let end = new Date();
      end.setDate(end.getDate() + days);
      document.getElementById('endDate').value = end.toISOString().split('T')[0];
    }
    calculateDailyBudget();
  }

  window.onload = () => {
    document.getElementById('startDate').value = today;
    let end = new Date();
    end.setDate(end.getDate() + 30);
    document.getElementById('endDate').value = end.toISOString().split('T')[0];
  };

  function calculateDailyBudget() {
    const total = parseInt(document.getElementById('totalLimit').value) || 0;
    const fixed = parseInt(document.getElementById('fixedCostSum').value) || 0;
    const start = new Date(document.getElementById('startDate').value);
    const end = new Date(document.getElementById('endDate').value);

    const diffTime = end - start;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

    // 결과값이 마이너스가 나오지 않도록 Math.max(0, ...) 사용
    if (diffDays > 0) {
      const daily = Math.max(0, Math.floor((total - fixed) / diffDays));
      document.getElementById('dailyAmount').innerText = daily.toLocaleString();
    } else {
      document.getElementById('dailyAmount').innerText = '0';
    }
  }

  async function handleSave() {
    const total = parseInt(document.getElementById('totalLimit').value) || 0;
    const fixed = parseInt(document.getElementById('fixedCostSum').value) || 0;

    if (total <= 0) { alert("총 예산을 입력해주세요."); return; }
    if (total < fixed) { alert("총 예산이 고정 지출보다 적습니다."); return; }

    alert("챌린지가 설정되었습니다! 🔥");
  }
</script>
</body>
</html>
