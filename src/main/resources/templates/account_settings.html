<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정보수정</title>

    <style>



        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            height: 874px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .box {
            width: 300px;
            height: 200px;
            background-color:#E5E5E5;
        }


        .inner-box {
            width: 100px;
            height: 100px;
            background-color: gray;
        }


        button {
            margin-top: 50px;
            width: 100%;
            padding: 12px;
            background-color:  black !important;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="box">
        <div class="inner-box"></div>
    </div>

    <button type="button" onclick="signup()">탈퇴하기</button>
</div>

<script src="/js/account_settings.js"></script>

</body>
</html>
