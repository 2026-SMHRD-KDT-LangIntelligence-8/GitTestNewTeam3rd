<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원정보수정</title>

    <style>



        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            height: 874px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;              /* ✅ 추가 */
            justify-content: center;   /* 가로 중앙 */
            align-items: center;       /* 세로 중앙 */
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;

        }

        .btn {
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            height:70px;
        }

        /* 주요 버튼 */
        .btn.primary {
            background-color: black;
            color: white;
        }

        /* 보조 버튼 */
        .btn.secondary {
            background-color: black;
            color: white;
        }

        /* 위험 버튼 */
        .btn.danger {
            background-color: #e74c3c;
            color:white;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="button-group">
        <button class="btn primary">계좌 및 카드 연동</button>
        <button class="btn secondary">회원정보 수정</button>
        <button class="btn danger">탈퇴하기</button>
    </div>
</div>
</body>
</html>
