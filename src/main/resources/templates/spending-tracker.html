<!DOCTYPE html>
<html lang="ko">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>소비캘린더</title>



    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>



    <style>





        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 400px;
            height: 874px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);

            display: flex;
            flex-direction: column; /* ✅ 추가 */

            align-items: center;


        }

        .title {
            margin-top: 30px;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
            color: black;
        }

        .output-box {
            margin-bottom: 5px;
            width: 92%;
            height: 140px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            background-color: #FDFDE6;
        }

        .filter-buttons {
            width: 92%;              /* output-box랑 맞추기 */
            display: flex;
            justify-content: flex-end;  /* 👉 오른쪽 정렬 핵심 */
        }






        .filter-btn {
            margin-bottom: 3px;
            margin-top: 80px;
            height: 35px;
            weight: 80px;
            padding: 6px 16px;
            border: 1px solid #999999; /* 테두리 */
            border-radius: 8px;
            background-color: #E5E5E5;
            color: black;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center; /* 가로 가운데 */
            align-items: center; /* 세로 가운데 */
        }

        /* 선택된 상태 */
        .filter-btn.active {
            border-color: #FFC107;     /* 노랑 포인트 */
            background-color: #fff8e1; /* 연한 노랑 */
            font-weight: bold;
        }

        /* hover 효과 */
        .filter-btn:hover {
            border-color: #FFC107;
        }

        /* today 버튼 */
        .fc .fc-button-primary {
            background-color: #e9e9e9;
            border: none;
            color: black;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: bold;
        }

        /* hover */
        .fc .fc-button-primary:hover {
            background-color: #e0a800;
        }

        /* 이전/다음 버튼 */
        .fc .fc-button {
            border-radius: 8px;
            padding: 6px 10px;
            background-color: #333;
            border: none;
        }

        /* 이전/다음 hover */
        .fc .fc-button:hover {
            background-color: #555;
        }

        /* 버튼 사이 간격 */
        .fc .fc-toolbar-chunk {
            display: flex;
            gap: 8px;
        }

        /* ✅ 제목과 버튼 간격 */
        .fc .fc-toolbar-title {
            margin-right: 20px;
        }

        /* ✅ 높이 정렬 (너가 물어본 코드🔥) */
        .fc .fc-toolbar {
            align-items: center;
        }


        .fc .fc-toolbar-title {
            white-space: normal;   /* 줄바꿈 허용 */
            line-height: 1.2;
        }

        .fc .fc-toolbar-title {
            width: 90px;
            white-space: normal;
            text-align: center;
            font-size: 30px;
            color: #FFCC00;
            font-family: 'BMJUA', sans-serif;
        }
        }


        .fc .fc-daygrid-day {
            height: 65px;
        }

        .fc .fc-daygrid-day-frame {
            height: 100%;
        }

        #calendar {
            width: 100%;
            max-width: 340px;
            margin-top: 30px;
            height: 430px;
        }



        /* 요일 이름 (Sun) */
        .fc .fc-col-header-cell.fc-day-sun {
            color: red;
        }

        /* 날짜 숫자 */
        .fc .fc-daygrid-day.fc-day-sun {
            color: red;
        }




        /* Sat (요일 이름) */
        .fc .fc-col-header-cell.fc-day-sat {
            color: blue;
        }

        /* 날짜 숫자 */
        .fc .fc-daygrid-day.fc-day-sat {
            color: blue;
        }






    </style>
</head>

<body>

<div class="container">
    <h1 class="title">❤️ 감성 분석 ❤️</h1>
    <div class="output-box">
        여기에 결과가 표시됩니다
    </div>
    <div class="filter-buttons">

        <button class="filter-btn"> 고정비</button>

    </div>
    <div id="calendar"></div>






</div>




<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth'
        });

        calendar.render();
    });
</script>






</body>
</html>
