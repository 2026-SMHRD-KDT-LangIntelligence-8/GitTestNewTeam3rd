<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오늘의 기록 입력</title>
    <style>
        body {
            background-color: #e9e9e9;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            width: 360px;
            height: 640px;
            padding: 20px 16px 20px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            box-sizing: border-box;
        }

        .scroll-area::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background-color: #d6d6d6;
            border-radius: 10px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .header {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            cursor: pointer;
            border: none;
            background: none;
            font-size: 18px;
            color: #888;
        }

        .info-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 25px;
        }

        .info-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .info-input {
            width: 100%;
            text-align: center;
            border: none;
            border-bottom: 2px solid #e0e0e0;
            background: transparent;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            outline: none;
            padding: 8px 4px;
            box-sizing: border-box;
        }

        .info-input:focus {
            border-bottom-color: #ffcc00;
        }

        .amount-input {
            color: #ffcc00;
        }

        .box {
            background-color: #fafff0;
            border: 1px solid #e0e7d0;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        .photo-box {
            height: 180px;
            cursor: pointer;
            position: relative;
            flex-direction: column;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-placeholder {
            color: #bbb;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
        }

        .file-input {
            display: none;
        }

        .memo-box {
            height: 100px;
            border: 1px solid #e0e7d0;
            resize: none;
            text-align: center;
            font-size: 16px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #fafff0;
            width: 100%;
            border-radius: 10px;
            outline: none;
            margin-bottom: 15px;
            overflow-y: auto;
            font-family: inherit;
        }

        .memo-box:focus {
            border-color: #ffcc00;
            background-color: #fffdf7;
        }

        .options-row {
            display: flex;
            margin-bottom: 15px;
        }

        .option-item {
            background-color: #fafff0;
            border: 1px solid #e0e7d0;
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            box-sizing: border-box;
        }

        .emoji-select {
            font-size: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            outline: none;
            appearance: none;
            text-align: center;
            width: 100%;
            padding: 5px 0;
        }

        .select-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .btn-wrapper {
            margin-bottom: 10px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-save {
            background-color: #ffcc00;
            color: white;
            border: none;
        }

        .btn-set-fixed {
            border: 2px solid #5fb1f7;
            background-color: white;
            color: #333;
        }

        .is-fixed-active {
            background-color: #5fb1f7 !important;
            color: white !important;
            border: none;
        }

        .btn-set-main {
            border: 2px solid #ffcc00;
            background-color: white;
            color: #333;
        }

        .is-main-active {
            background-color: #ffcc00 !important;
            color: white !important;
            border: none;
            cursor: default;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="scroll-area">
        <div class="header">
            <span class="back-btn" onclick="history.back()">←</span>
            <span>오늘의 기록 입력</span>
            <span></span>
        </div>

        <form th:action="@{/api/save}" method="post" enctype="multipart/form-data" onsubmit="return prepareSubmit()">
            <input type="hidden" name="userId" th:value="${userId}">
            <input type="hidden" name="date" th:value="${selectedDate}">
            <input type="hidden" name="regDate" th:value="${selectedDate}">
            <input type="hidden" name="emotionTag" id="emotionTagHidden" value="😊">
            <input type="hidden" name="isFixed" id="isFixedHidden" value="false">
            <input type="hidden" name="isManual" value="true">
            <input type="hidden" name="isImpulsive" value="false">

            <div class="info-row">
                <div class="info-item">
                    <span class="info-label">시간</span>
                    <input type="time"
                           name="spentAt"
                           class="info-input"
                           th:value="${#temporals.format(#temporals.createNow(), 'HH:mm')}"
                           required>
                </div>

                <div class="info-item">
                    <span class="info-label">장소</span>
                    <input type="text"
                           name="storeName"
                           class="info-input"
                           placeholder="장소"
                           required>
                </div>

                <div class="info-item">
                    <span class="info-label">금액</span>
                    <input type="number"
                           name="amount"
                           class="info-input amount-input"
                           placeholder="금액"
                           min="0"
                           step="100"
                           required>
                </div>
            </div>

            <label for="imageFile" class="box photo-box">
                <img id="previewImage" alt="미리보기">
                <div id="photoPlaceholder" class="photo-placeholder">
                    등록할 사진이 있으면 눌러서 추가해주세요
                </div>
            </label>
            <input type="file" id="imageFile" name="imageFile" class="file-input" accept="image/*">

            <textarea name="content"
                      id="memoContent"
                      class="memo-box"
                      placeholder="여기에 소비 메모를 남겨보세요!"></textarea>

            <div class="options-row">
                <div class="option-item">
                    <span class="select-label">오늘의 기분 선택</span>
                    <select id="emotionTag" class="emoji-select">
                        <option value="😊">😊</option>
                        <option value="😋">😋</option>
                        <option value="😭">😭</option>
                        <option value="😡">😡</option>
                        <option value="💸">💸</option>
                    </select>
                </div>
            </div>

            <div class="btn-wrapper">
                <button type="submit" class="btn-action btn-save">
                    💾 메모 및 기분 저장하기
                </button>
            </div>

            <div class="btn-wrapper">
                <button type="button"
                        id="fixedSetBtn"
                        class="btn-action btn-set-fixed"
                        onclick="toggleFixed()">
                    📌 고정비로 등록
                </button>
            </div>

            <div class="btn-wrapper">
                <button type="button"
                        id="mainSetBtn"
                        class="btn-action btn-set-main"
                        onclick="setMainPreview()">
                    🍙 오늘의 대표 지출
                </button>
            </div>

            <div class="btn-wrapper">
                <button type="button"
                        class="btn-action btn-delete"
                        onclick="deleteDraftRecord()">
                    내역 삭제
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageFile');
    const previewImage = document.getElementById('previewImage');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const emotionTag = document.getElementById('emotionTag');
    const emotionTagHidden = document.getElementById('emotionTagHidden');
    const isFixedHidden = document.getElementById('isFixedHidden');
    const fixedSetBtn = document.getElementById('fixedSetBtn');
    const mainSetBtn = document.getElementById('mainSetBtn');

    imageInput.addEventListener('change', function () {
        const file = this.files && this.files[0];

        if (!file) {
            previewImage.style.display = 'none';
            previewImage.src = '';
            photoPlaceholder.style.display = 'block';
            return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
            previewImage.src = e.target.result;
            previewImage.style.display = 'block';
            photoPlaceholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    emotionTag.addEventListener('change', function () {
        emotionTagHidden.value = this.value;
    });

    function toggleFixed() {
        const isActive = fixedSetBtn.classList.contains('is-fixed-active');

        if (isActive) {
            fixedSetBtn.classList.remove('is-fixed-active');
            fixedSetBtn.textContent = '📌 고정비로 등록';
            isFixedHidden.value = 'false';
        } else {
            fixedSetBtn.classList.add('is-fixed-active');
            fixedSetBtn.textContent = '📌 고정비 해제';
            isFixedHidden.value = 'true';
        }
    }

    function setMainPreview() {
        mainSetBtn.classList.toggle('is-main-active');

        if (mainSetBtn.classList.contains('is-main-active')) {
            mainSetBtn.textContent = '🌟 오늘의 대표 지출';
        } else {
            mainSetBtn.textContent = '🍙 오늘의 대표 지출';
        }
    }

    function deleteDraftRecord() {
        const check = confirm('입력 중인 내용을 지우시겠습니까?');
        if (!check) return;

        document.querySelector('form').reset();
        previewImage.style.display = 'none';
        previewImage.src = '';
        photoPlaceholder.style.display = 'block';
        emotionTagHidden.value = '😊';
        isFixedHidden.value = 'false';
        fixedSetBtn.classList.remove('is-fixed-active');
        fixedSetBtn.textContent = '📌 고정비로 등록';
        mainSetBtn.classList.remove('is-main-active');
        mainSetBtn.textContent = '🍙 오늘의 대표 지출';
        document.getElementById('emotionTag').value = '😊';
    }

    function prepareSubmit() {
        emotionTagHidden.value = emotionTag.value;
        return true;
    }
</script>

</body>
</html>
