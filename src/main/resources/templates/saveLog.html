<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지출 기록 추가</title>
    <style>
        body { background-color: #e9e9e9; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; width: 360px; height: 640px; padding: 20px; border-radius: 20px; position: relative; box-sizing: border-box; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; }

        /* 날짜 표시 헤더 */
        .date-header { text-align: center; font-size: 14px; color: #888; margin-bottom: 5px; font-weight: bold; }

        /* 상단 입력부 */
        .top-inputs { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 20px 0; gap: 8px; }
        .top-inputs input { border: none; border-bottom: 2px solid #eee; padding: 8px 0; text-align: center; font-size: 15px; font-weight: bold; outline: none; box-sizing: border-box; }
        .top-inputs input:focus { border-bottom-color: #ffcc00; }

        .time-input-container { position: relative; width: 38%; }
        .time-input { width: 100% !important; cursor: pointer; }

        input[type="time"]::-webkit-calendar-picker-indicator {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; opacity: 0;
        }

        .store-input { width: 30% !important; }
        .amount-input { width: 32% !important; }

        .content-area { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .box { background-color: #fafff0; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #666; font-size: 15px; cursor: pointer; border: 1px dashed #e0e7d0; transition: 0.2s; position: relative; overflow: hidden; }
        .box:hover { background-color: #f2f7e5; }
        .photo-box { height: 180px; padding: 0; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .memo-box { height: 140px; }

        .sub-buttons { display: flex; gap: 15px; margin-bottom: 20px; position: relative; }
        .btn-small { flex: 1; background-color: #fafff0; border: none; border-radius: 8px; padding: 12px; font-size: 13px; color: #444; cursor: pointer; text-align: center; }

        .emoji-picker {
            display: none; position: absolute; bottom: 50px; left: 0; width: 100%;
            background: white; border: 1px solid #ddd; border-radius: 10px;
            padding: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            justify-content: space-around; z-index: 10;
        }
        .emoji-item { font-size: 24px; cursor: pointer; transition: 0.2s; }
        .emoji-item:hover { transform: scale(1.3); }

        .action-buttons { display: flex; gap: 15px; }
        .btn-main { flex: 1; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; color: #333; transition: 0.2s; }
        .btn-reg { background-color: #ffcc00; }
        .btn-del { background-color: #ffda44; }

        textarea { width: 100%; height: 100%; border: none; background: transparent; resize: none; outline: none; padding: 15px; box-sizing: border-box; text-align: center; font-family: inherit; }
    </style>
</head>
<body>

<div class="container">
    <div class="date-header"
         th:text="${selectedDate != null ? selectedDate : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')} + ' 기록 추가'">
        2026-03-27 기록 추가
    </div>

    <form th:action="@{/api/save}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="userId" th:value="${userId}">

        <input type="hidden" name="regDate"
               th:value="${selectedDate != null ? selectedDate : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">

        <input type="hidden" name="emotionTag" id="emotionTagInput" value="">

        <div class="top-inputs">
            <div class="time-input-container">
                <input type="time" name="spentAt" class="time-input"
                       th:value="${#temporals.format(#temporals.createNow(), 'HH:mm')}" required>
            </div>
            <input type="text" name="storeName" class="store-input" placeholder="장소" required>
            <input type="number" name="amount" id="amountInput" class="amount-input" placeholder="금액" step="1000" min="0" required>
        </div>

        <div class="content-area">
            <div class="box photo-box" onclick="document.getElementById('fileInput').click();">
                <img id="preview" alt="미리보기">
                <span id="photo-text">사진 추가</span>
                <input type="file" id="fileInput" name="imageFile" accept="image/*" style="display:none;" onchange="previewImage(this);">
            </div>
            <div class="box memo-box">
                <textarea name="content" placeholder="메모 추가"></textarea>
            </div>
        </div>

        <div class="sub-buttons">
            <button type="button" class="btn-small" id="emojiBtn" onclick="toggleEmojiPicker()">이모티콘 선택</button>
            <button type="button" class="btn-small">고정비 등록</button>

            <div class="emoji-picker" id="emojiPicker">
                <span class="emoji-item" onclick="selectEmoji('😊')">😊</span>
                <span class="emoji-item" onclick="selectEmoji('😭')">😭</span>
                <span class="emoji-item" onclick="selectEmoji('😡')">😡</span>
                <span class="emoji-item" onclick="selectEmoji('😋')">😋</span>
                <span class="emoji-item" onclick="selectEmoji('💸')">💸</span>
            </div>
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn-main btn-reg">등록</button>
            <button type="button" class="btn-main btn-del" onclick="history.back()">취소</button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    // 1. 금액 보정 (1000원 단위)
    const amountInput = document.getElementById('amountInput');
    amountInput.addEventListener('blur', function() {
        let value = parseInt(this.value) || 0;
        if (value > 0) this.value = Math.round(value / 1000) * 1000;
    });

    // 2. 사진 미리보기
    function previewImage(input) {
        const preview = document.getElementById('preview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('photo-text').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 3. 이모티콘 선택 기능
    function toggleEmojiPicker() {
        const picker = document.getElementById('emojiPicker');
        picker.style.display = (picker.style.display === 'flex') ? 'none' : 'flex';
    }

    function selectEmoji(emoji) {
        document.getElementById('emojiBtn').innerText = emoji;
        document.getElementById('emotionTagInput').value = emoji;
        toggleEmojiPicker();
    }
</script>

</body>
</html>
